interface:
  display_name: "GitHub Code Review"
  short_description: "Review code with four specialists for nontrivial changes"
  default_prompt: "Use $github-code-review to review this change against its ticket, using contrarian, Clean Code, regression, and security reviewers for nontrivial changes; report findings in chat for my PRs or save kind pending inline feedback on other authors' PRs."
policy:
  allow_implicit_invocation: true
